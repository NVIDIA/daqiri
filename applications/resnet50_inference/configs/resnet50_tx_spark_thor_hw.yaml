%YAML 1.2
---
# Hardware-reorder comparison TX. Packet/image/batch geometry matches the
# software campaign; only the cyclic sequence location and PCAP differ.
daqiri:
  cfg:
    version: 1
    stream_type: "raw"
    engine: "ibverbs"
    master_core: 0
    debug: false
    log_level: "info"
    loopback: ""
    memory_regions:
    - name: "Data_TX_GPU"
      kind: "host_pinned"
      affinity: 0
      num_bufs: 51200
      buf_size: 2048
    interfaces:
    - name: "tx_port"
      address: "0002:01:00.1"
      tx:
        queues:
        - name: "tx_q_0"
          id: 0
          batch_size: 4096
          cpu_core: 4
          memory_regions: ["Data_TX_GPU"]
          offloads: ["tx_eth_src"]
bench_tx:
- interface_name: "tx_port"
  cpu_core: 3
  batch_size: 4096
  payload_size: 1176
  header_size: 64
  eth_dst_addr: ac:3a:e2:86:7a:0f
  ip_src_addr: 1.1.1.1
  ip_dst_addr: 2.2.2.2
  udp_src_port: 4096
  udp_dst_port: 4096
packetization:
  reorder_name: "rx_reorder_resnet_int8_hw"
  out_payload_len: 1176
  packets_per_image: 128
  images_per_batch: 32
  payload_byte_offset: 64
  seq_bit_offset: 336
  seq_bit_width: 16
dataset:
  pcap_path: "data/cifar10_resnet_hw_seq336.pcap"
stats:
  enabled: false
  top_k: 8
