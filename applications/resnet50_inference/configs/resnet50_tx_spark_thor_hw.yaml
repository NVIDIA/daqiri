%YAML 1.2
---
# Primary hardware-reorder TX. Thirty-two packets per image is the largest
# exact power-of-two image geometry accepted by the 9100-byte wire-frame limit.
daqiri:
  cfg:
    version: 1
    stream_type: "raw"
    engine: "ibverbs"
    master_core: 8
    debug: false
    log_level: "info"
    loopback: ""
    memory_regions:
    - name: "Data_TX_0"
      kind: "host_pinned"
      affinity: 0
      num_bufs: 12800
      buf_size: 8192
    - name: "Data_TX_1"
      kind: "host_pinned"
      affinity: 0
      num_bufs: 12800
      buf_size: 8192
    interfaces:
    # Both PCIe functions multiplex onto the Spark's physical p1 data port.
    - name: "tx_path_0"
      address: "0000:01:00.1"
      tx:
        queues:
        - name: "tx_q_0"
          id: 0
          batch_size: 1024
          cpu_core: 17
          pacing_mbps: 48000
          memory_regions: ["Data_TX_0"]
          offloads: ["tx_eth_src"]
    - name: "tx_path_1"
      address: "0002:01:00.1"
      tx:
        queues:
        - name: "tx_q_0"
          id: 0
          batch_size: 1024
          cpu_core: 19
          pacing_mbps: 48000
          memory_regions: ["Data_TX_1"]
          offloads: ["tx_eth_src"]
bench_tx:
- interface_name: "tx_path_0"
  cpu_core: 16
  batch_size: 1024
  payload_size: 4704
  header_size: 64
  eth_dst_addr: ac:3a:e2:86:7a:0f
  ip_src_addr: 1.1.1.1
  ip_dst_addr: 2.2.2.2
  udp_src_port: 4096
  udp_dst_port: 4096
- interface_name: "tx_path_1"
  cpu_core: 18
  batch_size: 1024
  payload_size: 4704
  header_size: 64
  eth_dst_addr: ac:3a:e2:86:7a:0f
  ip_src_addr: 1.1.1.1
  ip_dst_addr: 2.2.2.2
  udp_src_port: 4096
  udp_dst_port: 4096
packetization:
  reorder_name: "rx_reorder_resnet_int8_hw"
  out_payload_len: 4704
  packets_per_image: 32
  images_per_batch: 32
  payload_byte_offset: 64
  seq_bit_offset: 336
  seq_bit_width: 16
dataset:
  pcap_path: "data/cifar10_resnet_hw_4704_seq336.pcap"
stats:
  enabled: false
  top_k: 8
