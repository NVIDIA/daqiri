%YAML 1.2
---
# Cabled p0->p1 NIC hardware-reorder smoke. The cyclic 16-bit sequence occupies
# UDP payload bytes 0-1 (bit 336); bytes 2-3 remain zero for exact matching.
daqiri:
  cfg:
    version: 1
    stream_type: "raw"
    engine: "ibverbs"
    master_core: 3
    debug: false
    log_level: "info"
    loopback: ""
    memory_regions:
    - name: "Data_TX_GPU"
      kind: "host_pinned"
      affinity: 0
      num_bufs: 16384
      buf_size: 2048
    - name: "Data_RX_GPU"
      kind: "host_pinned"
      affinity: 0
      num_bufs: 51200
      buf_size: 1240
    - name: "Reorder_RX_GPU"
      kind: "host_pinned"
      affinity: 0
      # 16 * 4096 fixed placements cover the complete 16-bit sequence ring.
      num_bufs: 16
      buf_size: 4816896
    interfaces:
    - name: "tx_port"
      address: <tx-pcie-addr>
      tx:
        queues:
        - name: "tx_q_0"
          id: 0
          batch_size: 4096
          cpu_core: 11
          pacing_mbps: 50
          memory_regions: ["Data_TX_GPU"]
          offloads: ["tx_eth_src"]
    - name: "rx_port"
      address: <rx-pcie-addr>
      rx:
        flow_isolation: true
        queues:
        - name: "rq_q_0"
          id: 0
          cpu_core: 9
          # Match the reorder window for an apples-to-apples delivery-latency
          # comparison with software reorder.
          batch_size: 4096
          timeout_us: 2000
          memory_regions: ["Data_RX_GPU"]
        flows:
        - name: "flow_resnet"
          id: 201
          action: {type: queue, id: 0}
          # Hardware reorder gate flows currently support UDP destination only.
          match: {udp_dst: 4096}
        reorder_configs:
        - name: "rx_reorder_resnet_int8_hw"
          reorder_engine: "hw"
          cyclic_sequence: true
          missing_action: "passthrough"
          reorder_type: "gpu"
          memory_region: "Reorder_RX_GPU"
          payload_byte_offset: 64
          packet_size: 1176
          flow_ids: [201]
          method:
            seq_packets_per_batch:
              sequence_number: {bit_offset: 336, bit_width: 16}
              packets_per_batch: 4096
bench_rx:
- interface_name: "rx_port"
  cpu_core: 8
bench_tx:
- interface_name: "tx_port"
  cpu_core: 10
  batch_size: 4096
  payload_size: 1176
  header_size: 64
  eth_dst_addr: <rx-port-mac>
  ip_src_addr: 1.1.1.1
  ip_dst_addr: 2.2.2.2
  udp_src_port: 4096
  udp_dst_port: 4096
packetization:
  reorder_name: "rx_reorder_resnet_int8_hw"
  packets_per_image: 128
  images_per_batch: 32
inference:
  onnx_path: "models/resnet50_features.int8in.onnx"
  engine_path: "models/resnet50_features.int8in.engine"
  enable_fp16: true
  enable_int8: true
  channels: 3
  height: 224
  width: 224
  feature_dim: 2048
  opt_min: 1
  opt_avg: 32
  opt_max: 256
  cpu_core: 7
  input_name: "input"
  output_name: "features"
dataset:
  pcap_path: "data/cifar10_resnet_hw_seq336.pcap"
stats:
  enabled: true
  top_k: 8
