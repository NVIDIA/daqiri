%YAML 1.2
---
# Primary ConnectX-7 hardware-reorder path at normal application packet geometry.
daqiri:
  cfg:
    version: 1
    stream_type: "raw"
    engine: "ibverbs"
    master_core: 3
    debug: false
    log_level: "info"
    loopback: ""
    memory_regions:
    - name: "Data_RX_GPU"
      kind: "device"
      affinity: 0
      num_bufs: 51200
      buf_size: 4768
    - name: "Reorder_RX_GPU"
      kind: "device"
      affinity: 0
      # Sixteen cyclic batches stay at the engine's recommended 16K private-
      # destination ceiling and provide enough time for destination rearm at
      # the lossless campaign pacing.
      num_bufs: 16
      buf_size: 4816896
    interfaces:
    - name: "rx_port"
      address: "0004:03:00.1"
      rx:
        flow_isolation: true
        queues:
        - name: "rq_q_0"
          id: 0
          cpu_core: 9
          batch_size: 1024
          # The two Spark TX functions contribute alternating halves of each
          # batch. Allow inter-path startup skew without prematurely resetting
          # a direct-placement batch while the CQ is continuously busy.
          timeout_us: 1000000
          memory_regions: ["Data_RX_GPU"]
        flows:
        - name: "flow_resnet"
          id: 201
          action: {type: queue, id: 0}
          match: {udp_dst: 4096}
        reorder_configs:
        - name: "rx_reorder_resnet_int8_hw"
          reorder_engine: "hw"
          cyclic_sequence: true
          missing_action: "passthrough"
          reorder_type: "gpu"
          memory_region: "Reorder_RX_GPU"
          payload_byte_offset: 64
          packet_size: 4704
          flow_ids: [201]
          method:
            seq_packets_per_batch:
              sequence_number: {bit_offset: 336, bit_width: 16}
              packets_per_batch: 1024
bench_rx:
- interface_name: "rx_port"
  cpu_core: 8
packetization:
  reorder_name: "rx_reorder_resnet_int8_hw"
  packets_per_image: 32
  images_per_batch: 32
inference:
  onnx_path: "models/resnet50_features.onnx"
  engine_path: "models/resnet50_features.fp16in.engine"
  enable_fp16: true
  channels: 3
  height: 224
  width: 224
  feature_dim: 2048
  opt_min: 1
  opt_avg: 32
  opt_max: 256
  cpu_core: 10
  input_name: "input"
  output_name: "features"
stats:
  enabled: true
  top_k: 8
