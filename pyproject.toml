[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/portable"]
pythonpath = ["."]
addopts = [
  "-ra",
  "--strict-markers",
]
markers = [
  "bindings: requires DAQIRI built with DAQIRI_BUILD_PYTHON=ON",
  "platform: requires a provisioned CI/CD platform with the declared capabilities",
]
