# Runtime named-sender TX/RX example for the pure ibverbs raw engine.
#
# Replace both PCI BDFs, CPU cores, and eth_dst_addr for your system. The TX
# packet buffers contain only the 8000-byte payload. daqiri_example_named_sender
# creates the Ethernet/IPv4/UDP template at runtime with add_sender(), then the
# NIC sends that template inline and gathers segment 0 as the payload.
%YAML 1.2
---
daqiri:
  cfg:
    version: 1
    stream_type: "raw"
    engine: "ibverbs"
    master_core: <3>
    debug: false
    log_level: "info"
    loopback: ""

    memory_regions:
    - name: "Data_TX_GPU"
      kind: "device"
      affinity: 0
      num_bufs: 51200
      buf_size: 8064
    - name: "Data_RX_GPU"
      kind: "device"
      affinity: 0
      num_bufs: 51200
      buf_size: 8064

    interfaces:
    - name: "tx_port"
      address: <0000:00:00.0>
      tx:
        queues:
        - name: "tx_q_0"
          id: 0
          batch_size: 10240
          cpu_core: <11>
          memory_regions:
            - "Data_TX_GPU"
    - name: "rx_port"
      address: <0000:00:00.0>
      rx:
        flow_isolation: true
        queues:
        - name: "rx_q_0"
          id: 0
          cpu_core: <9>
          batch_size: 10240
          memory_regions:
            - "Data_RX_GPU"
        flows:
        - name: "named_sender_flow"
          id: 0
          action:
            type: queue
            id: 0
          match:
            udp_src: 4096
            udp_dst: 4096

bench_rx:
- interface_name: "rx_port"
  queue_id: 0
  cpu_core: <8>

bench_tx:
- interface_name: "tx_port"
  queue_id: 0
  cpu_core: <10>
  batch_size: 10240
  payload_size: 8000
  eth_dst_addr: <00:00:00:00:00:00>
  ip_src_addr: <1.2.3.4>
  ip_dst_addr: <5.6.7.8>
  udp_src_port: 4096
  udp_dst_port: 4096
