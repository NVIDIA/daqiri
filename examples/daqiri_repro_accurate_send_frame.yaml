# Single-port hardware-loopback reproduction for framed accurate-send traffic.
# Replace the PCI BDF, CPU cores, and MAC addresses for the test host. The mapped
# TX SQ is expected to have 16,384 WQEBBs: 8,192 TX packet slots, with every
# scheduled packet consuming one WAIT plus one SEND WQE.
%YAML 1.2
---
daqiri:
  cfg:
    version: 1
    stream_type: "raw"
    engine: "ibverbs"
    master_core: 3
    debug: false
    log_level: "info"
    loopback: "hw"

    memory_regions:
    - name: "Frame_TX_Header"
      kind: "huge"
      affinity: 0
      num_bufs: 8192
      buf_size: 62
    - name: "Frame_TX_Payload"
      kind: "device"
      affinity: 0
      num_bufs: 8192
      buf_size: 1440
    - name: "Frame_RX_Header"
      kind: "huge"
      affinity: 0
      num_bufs: 16384
      buf_size: 62
    - name: "Frame_RX_Payload"
      kind: "device"
      affinity: 0
      num_bufs: 16384
      buf_size: 1440

    interfaces:
    - name: "loopback_port"
      address: <0000:00:00.0>
      tx:
        accurate_send: true
        queues:
        - name: "tx_q_0"
          id: 0
          batch_size: 4320
          cpu_core: 5
          memory_regions:
            - "Frame_TX_Header"
            - "Frame_TX_Payload"
          offloads:
            - "tx_eth_src"
      rx:
        flow_isolation: true
        hardware_timestamps: true
        queues:
        - name: "rx_q_0"
          id: 0
          cpu_core: 6
          batch_size: 4320
          timeout_us: 100
          memory_regions:
            - "Frame_RX_Header"
            - "Frame_RX_Payload"
        flows:
        - name: "frame_flow"
          id: 0
          action:
            type: queue
            id: 0
          match:
            udp_src: 4096
            udp_dst: 4096

bench_rx:
  interface_name: "loopback_port"
  queue_id: 0
  cpu_core: 7

bench_tx:
  interface_name: "loopback_port"
  queue_id: 0
  cpu_core: 4
  batch_size: 4320
  payload_size: 1440
  header_size: 62
  eth_src_addr: <00:00:00:00:00:00>
  eth_dst_addr: <00:00:00:00:00:00>
  ip_src_addr: 1.2.3.4
  ip_dst_addr: 5.6.7.8
  udp_src_port: 4096
  udp_dst_port: 4096
