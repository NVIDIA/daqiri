%YAML 1.2
---
daqiri:
  cfg:
    version: 1
    stream_type: "raw"
    engine: "ibverbs"
    master_core: 3
    debug: false
    log_level: "info"
    loopback: ""

    memory_regions:
    - name: "Data_TX_CPU"
      kind: "huge"
      affinity: 0
      num_bufs: 16384
      buf_size: 8256
    - name: "Data_RX_CPU"
      kind: "host_pinned"
      affinity: 0
      num_bufs: 16384
      buf_size: 8256
    - name: "Reorder_RX_CPU"
      kind: "host_pinned"
      affinity: 0
      # Two cyclic batch slots, each holding 1024 8192-byte packets.
      num_bufs: 2
      buf_size: 8388608

    interfaces:
    - name: "tx_port"
      address: <0000:00:00.0>
      tx:
        queues:
        - name: "tx_q_0"
          id: 0
          batch_size: 1024
          cpu_core: 11
          memory_regions:
            - "Data_TX_CPU"
          offloads:
            - "tx_eth_src"
    - name: "rx_port"
      address: <0000:00:00.0>
      rx:
        flow_isolation: true
        queues:
        - name: "rx_q_0"
          id: 0
          cpu_core: 9
          batch_size: 1024
          timeout_us: 0
          memory_regions:
            - "Data_RX_CPU"
        flows:
        - name: "flow_0"
          id: 201
          action:
            type: queue
            id: 0
          match:
            udp_dst: 5000
        reorder_configs:
        - name: "rx_reorder_seq_1024"
          reorder_engine: "hw"
          cyclic_sequence: true
          reorder_type: "cpu"
          memory_region: "Reorder_RX_CPU"
          payload_byte_offset: 42
          packet_size: 8192
          flow_ids:
            - 201
          method:
            seq_packets_per_batch:
              # The NIC matches the two-buffer cyclic sequence value directly.
              sequence_number:
                bit_offset: 336
                bit_width: 32
              packets_per_batch: 1024

bench_rx:
  interface_name: "rx_port"
  cpu_core: 8

bench_tx:
  interface_name: "tx_port"
  cpu_core: 10
  batch_size: 1024
  payload_size: 8192
  header_size: 42
  eth_dst_addr: <00:00:00:00:00:00>
  ip_src_addr: <1.2.3.4>
  ip_dst_addr: <5.6.7.8>
  udp_src_port: 5000
  udp_dst_port: 5000

  # Writes a cyclic network-order uint32 into UDP payload bytes [0:4].
  sequence_number_offset: 0
  sequence_number_start: 0
  sequence_number_modulus: 2048
