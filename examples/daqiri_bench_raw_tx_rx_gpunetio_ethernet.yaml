%YAML 1.2
---
# Closed-loop raw TX+RX on the experimental gpunetio_ethernet engine (DOCA GPUNetIO): CUDA kernels drive
# the NIC queues. Build with gpunetio_ethernet in DAQIRI_ENGINE and run as root.
daqiri:
  cfg:
    version: 1
    stream_type: "raw"
    engine: "gpunetio_ethernet"
    master_core: 3
    debug: false
    log_level: "info"
    loopback: ""

    memory_regions:
    - name: "Data_TX_GPU"
      kind: "device"
      affinity: 0
      num_bufs: 51200
      buf_size: 8064
    # The RX region holds the receive ring: a power-of-two count of slots, each a power of two
    # up to 8 kB. Packets bigger than a slot stop the queue, so keep the port MTU below it.
    - name: "Data_RX_GPU"
      kind: "device"
      affinity: 0
      num_bufs: 65536
      buf_size: 8192

    interfaces:
    - name: "tx_port"
      address: <0000:00:00.0>
      tx:
        queues:
        - name: "tx_q_0"
          id: 0
          batch_size: 10240
          cpu_core: 11
          memory_regions:
            - "Data_TX_GPU"
          gpunetio_ethernet:
            # persistent: a resident kernel takes the bursts, several in flight
            # per_burst: one kernel launch per send_tx_burst()
            tx_kernel: "persistent"
    - name: "rx_port"
      address: <0000:00:00.0>
      rx:
        flow_isolation: true
        queues:
        - name: "rq_q_0"
          id: 0
          cpu_core: 9
          batch_size: 10240
          memory_regions:
            - "Data_RX_GPU"
        flows:
        - name: "flow_0"
          id: 1
          action:
            type: queue
            id: 0
          match:
            udp_src: 4096
            udp_dst: 4096

bench_rx:
- interface_name: "rx_port"
  cpu_core: 8

bench_tx:
- interface_name: "tx_port"
  cpu_core: 10
  batch_size: 10240
  payload_size: 8000
  header_size: 64
  eth_dst_addr: <00:00:00:00:00:00>
  ip_src_addr: <1.2.3.4>
  ip_dst_addr: <5.6.7.8>
  udp_src_port: 4096
  udp_dst_port: 4096
