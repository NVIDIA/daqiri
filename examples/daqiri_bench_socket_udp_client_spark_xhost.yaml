# DGX Spark (GB10) cross-host UDP client config for daqiri_bench_socket.
# Sending half of the pair that produced the Socket / UDP rows in
# docs/benchmarks/performance-dgx-spark.md. Run the server half from
# daqiri_bench_socket_udp_server_spark_xhost.yaml on the peer host.
#
# Unlike the RoCE cross-host config, the socket engine binds every interface
# listed in the file during daqiri_init, so the two roles CANNOT share one
# config: the client host does not own the server's address and the bind would
# fail. Hence one file per role.
#
# Replace <client-ip>, <server-ip>, and the CPU placeholders for each host
# before running. Keep the same endpoint values in the peer server config.
#
# Before running, apply cross-host L3 on both boxes:
#   sudo scripts/setup_spark_xhost_net.sh --role tx --peer-mac <SERVER_P0_MAC>
# See docs/tutorials/system_configuration.md#cross-host-variant-two-sparks.
#
# Start the server first, then run the client. UDP has no flow control, so pace
# it: --target-gbps drives a token-bucket pacer, and the published rows are the
# highest rate that held zero loss over three reps (25 Gb/s at 8000 B).
#   sudo ./daqiri_bench_socket <this.yaml> --mode client --seconds 30 --target-gbps 25
# Omit --target-gbps to measure the unpaced rate, where the receiver's drain
# rate decides what arrives. Walk the target up until the server's recv_bytes
# stops tracking the client's sent_bytes to find the loss-free rate for a
# different message size or core layout.
#
# Reproduces the 8000 B row as shipped. For the other published message sizes
# set message_size to 1000 or 65507 here AND in the server config; the buffers
# are already sized for the largest of them.
#
# `socket_bench_client.cpu_core` pins the benchmark worker. For UDP,
# `rx.queues[].cpu_core` pins the separate socket receive-I/O thread. Keep an
# RX I/O/worker pair in one performance cluster when measuring receive rate.
#
%YAML 1.2
---
daqiri:
  cfg:
    version: 1
    stream_type: "socket"
    master_core: <master-core>
    debug: false
    log_level: "info"

    memory_regions:
    - name: "DATA_SOCKET_CLIENT"
      kind: "host"
      affinity: 0
      num_bufs: 1024
      buf_size: 65536

    interfaces:
    - name: udp_client
      address: <client-ip>
      socket_config:
        mode: client
        local_addr: "udp://<client-ip>:5002"
        remote_addr: "udp://<server-ip>:5001"
        max_payload_size: 65535
      rx:
        queues:
        - name: "Client_RX_Queue"
          id: 0
          cpu_core: <client-rx-io-core>
          batch_size: 1
          memory_regions:
            - "DATA_SOCKET_CLIENT"
      tx:
        queues:
        - name: "Client_TX_Queue"
          id: 0
          cpu_core: <client-tx-core>
          batch_size: 1
          memory_regions:
            - "DATA_SOCKET_CLIENT"

socket_bench_client:
  server: false
  send: true
  receive: false
  cpu_core: <client-worker-core>
  iterations: 1000000000
  message_size: 8000
  server_address: <server-ip>
  client_address: <client-ip>
  server_port: 5001
