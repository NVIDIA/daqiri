# RTX PRO 6000 -- Header-Data Split over the 400 GbE wire loopback.
#
# Headers land in CPU hugepage memory and payloads in GPU memory, so the two
# `affinity` fields mean different things: a NUMA node for the kind: huge
# regions, a CUDA ordinal for the kind: device ones. The values below are for
# the reference host (tx_port 0000:05:00.0 / GPU 0, rx_port 0000:75:00.0 /
# GPU 2); run scripts/discover_rtx_pro_topology.sh for yours.
#
# Prerequisites, both ports:
#   ethtool -A <iface> rx off tx off    # 802.3x pause costs over 20% of line rate
#   ip link set dev <iface> mtu 9000    # payload is 8000 bytes
#
# Run:
#   sudo ./build/examples/daqiri_bench_raw_hds <this.yaml> --seconds 30 --workload fft
#   sudo ./examples/run_rtx_pro_bench.sh dpdk-hds issue17 --seconds 30
#
%YAML 1.2
---
daqiri:
  cfg:
    version: 1
    stream_type: "raw"
    master_core: 3
    debug: false
    log_level: "info"
    loopback: ""

    memory_regions:
    - name: "Data_TX_CPU"
      kind: "huge"
      affinity: 0
      num_bufs: 51200
      buf_size: 64
    - name: "Data_TX_GPU"
      kind: "device"
      affinity: 0
      num_bufs: 51200
      buf_size: 8064
    - name: "Data_RX_CPU"
      kind: "huge"
      affinity: 0
      num_bufs: 51200
      buf_size: 64
    - name: "Data_RX_GPU"
      kind: "device"
      affinity: 2
      num_bufs: 51200
      buf_size: 8000

    interfaces:
    - name: "tx_port"
      address: 0000:05:00.0
      tx:
        queues:
        - name: "tx_q_0"
          id: 0
          batch_size: 4096
          cpu_core: 11
          memory_regions:
            - "Data_TX_CPU"
            - "Data_TX_GPU"
          offloads:
            - "tx_eth_src"
    - name: "rx_port"
      address: 0000:75:00.0
      rx:
        flow_isolation: true
        queues:
        - name: "rq_q_0"
          id: 0
          cpu_core: 9
          batch_size: 4096
          memory_regions:
            - "Data_RX_CPU"
            - "Data_RX_GPU"
        flows:
        - name: "flow_0"
          id: 0
          action:
            type: queue
            id: 0
          match:
            udp_src: 4096
            udp_dst: 4096
            ipv4_len: 8050

bench_rx:
  interface_name: "rx_port"
  cpu_core: 8

bench_tx:
  interface_name: "tx_port"
  cpu_core: 10
  batch_size: 4096
  payload_size: 8000
  header_size: 64
  eth_dst_addr: <00:00:00:00:00:00>
  ip_src_addr: 1.2.3.4
  ip_dst_addr: 5.6.7.8
  udp_src_port: 4096
  udp_dst_port: 4096
