# DGX Spark (GB10) cross-host TCP server config for daqiri_bench_socket.
# Receiving half of the pair that produced the Socket / TCP rows in
# docs/benchmarks/performance-dgx-spark.md. Run the client half from
# daqiri_bench_socket_tcp_client_spark_xhost.yaml on the peer host.
#
# Unlike the RoCE cross-host config, the socket engine binds every interface
# listed in the file during daqiri_init, so the two roles CANNOT share one
# config: the server host does not own the client's address and the bind would
# fail. Hence one file per role.
#
# Before running, apply cross-host L3 on both boxes:
#   sudo scripts/setup_spark_xhost_net.sh --role rx --peer-mac <CLIENT_P0_MAC>
# See docs/tutorials/system_configuration.md#cross-host-variant-two-sparks.
#
# Run the server first and let it outlive the client:
#   sudo ./daqiri_bench_socket <this.yaml> --mode server --seconds 42
#
# TCP self-paces through flow control, so it runs unthrottled -- no
# --target-gbps. Reproduces the 1 MiB row as shipped; for the 1000 B and 8000 B
# rows set message_size here AND in the client config. The buffers are sized
# for the 1 MiB message, which covers the smaller ones too.
#
# Spark substitutions baked in here:
#   - IPs: 2.2.2.2 (server p0); the client host is 1.1.1.1
#   - cpu_core: DAQIRI queue on isolated X925 core 18, bench app thread on 9,
#     master_core 8. The queue poller and the app thread MUST be on separate
#     cores; sharing one costs roughly 4x on TCP. See
#     docs/benchmarks/socket_benchmarking.md.
#
%YAML 1.2
---
daqiri:
  cfg:
    version: 1
    stream_type: "socket"
    master_core: 8
    debug: false
    log_level: "info"

    memory_regions:
    - name: "DATA_SOCKET_SERVER"
      kind: "host"
      affinity: 0
      num_bufs: 64
      buf_size: 1052672

    interfaces:
    - name: tcp_server
      address: 2.2.2.2
      socket_config:
        mode: server
        local_addr: "tcp://2.2.2.2:6001"
        max_payload_size: 1052672
      rx:
        queues:
        - name: "Server_RX_Queue"
          id: 0
          cpu_core: 18
          batch_size: 1
          memory_regions:
            - "DATA_SOCKET_SERVER"
      tx:
        queues:
        - name: "Server_TX_Queue"
          id: 0
          cpu_core: 18
          batch_size: 1
          memory_regions:
            - "DATA_SOCKET_SERVER"

socket_bench_server:
  server: true
  send: false
  receive: true
  cpu_core: 9
  iterations: 1000000000
  message_size: 1048576
  server_address: 2.2.2.2
  server_port: 6001
