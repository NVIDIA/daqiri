# Single-port hardware-loopback variant of the framed accurate-send
# reproduction. Each 64-byte host packet is copied into its mlx5 SEND WQE;
# packet cadence and frame timing match daqiri_repro_accurate_send_frame.yaml.
%YAML 1.2
---
daqiri:
  cfg:
    version: 1
    stream_type: "raw"
    engine: "ibverbs"
    master_core: 3
    debug: false
    log_level: "info"
    loopback: "hw"

    memory_regions:
    - name: "Frame_TX_Inline"
      kind: "huge"
      affinity: 0
      num_bufs: 8192
      buf_size: 64
    - name: "Frame_RX_Packet"
      kind: "huge"
      affinity: 0
      num_bufs: 16384
      # This adapter advertises a 64-byte MPRQ stride but rejects CREATE_RQ at
      # that minimum. A 128-byte receive slot still captures a 64-byte frame.
      buf_size: 128

    interfaces:
    - name: "loopback_port"
      address: <0000:00:00.0>
      tx:
        accurate_send: true
        queues:
        - name: "tx_q_0"
          id: 0
          batch_size: 4320
          cpu_core: 5
          inline_data: true
          memory_regions:
            - "Frame_TX_Inline"
          offloads:
            - "tx_eth_src"
      rx:
        flow_isolation: true
        hardware_timestamps: true
        queues:
        - name: "rx_q_0"
          id: 0
          cpu_core: 6
          batch_size: 4320
          timeout_us: 100
          memory_regions:
            - "Frame_RX_Packet"
        flows:
        - name: "frame_flow"
          id: 0
          action:
            type: queue
            id: 0
          match:
            udp_src: 4096
            udp_dst: 4096

bench_rx:
  interface_name: "loopback_port"
  queue_id: 0
  cpu_core: 7

bench_tx:
  interface_name: "loopback_port"
  queue_id: 0
  cpu_core: 4
  batch_size: 4320
  payload_size: 0
  header_size: 64
  eth_src_addr: <00:00:00:00:00:00>
  eth_dst_addr: <00:00:00:00:00:00>
  ip_src_addr: 1.2.3.4
  ip_dst_addr: 5.6.7.8
  udp_src_port: 4096
  udp_dst_port: 4096
