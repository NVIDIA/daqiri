# RTX PRO 6000 Blackwell -- 400 GbE wire loopback, one cable between two ports.
#
# Values below are for the reference host (two 400G ports, one cable):
#   tx_port 0000:05:00.0 (ens15f0np0)  GPU CUDA 0 (0000:03:00.0, PIX)
#   rx_port 0000:75:00.0 (ens16f0np0)  GPU CUDA 2 (0000:73:00.0, PIX)
#
# Each memory region is pinned to a GPU on the same PCIe switch as its own port,
# so payload DMA stays local instead of crossing the CPU root complex.
# `affinity` under kind: device is a CUDA ordinal, not a NUMA node, and CUDA
# ordinals shift when a board faults; resolve them with
# scripts/discover_rtx_pro_topology.sh rather than assuming 0 and 1.
#
# Prerequisites, both ports (each silently costs throughput):
#   ethtool -A <iface> rx off tx off    # 802.3x pause: over 20% of line rate,
#                                       # and no drop counter records the loss
#   ip link set dev <iface> mtu 9000    # 8000-byte payloads need a jumbo MTU
#
# Requires a real L2 path between the two ports (loopback cable, passive optic,
# or switch). Confirm the two ports face each other -- carrier=1 only means each
# has *a* link partner:
#   lldpctl -f keyvalue <iface> | grep port.mac
#
# After a run, tx_phy_packets / rx_phy_packets rising with TX/RX confirms the
# frames crossed the SerDes; near zero means the traffic never left the chip.
#
# Build: cmake ... -DCMAKE_CUDA_ARCHITECTURES=120 && cmake --build build -j
# Run:
#   sudo ./build/examples/daqiri_bench_raw_gpudirect \
#     ./build/examples/daqiri_bench_raw_tx_rx_rtx_pro_6000_nic.yaml --seconds 30
#   sudo ./examples/run_rtx_pro_bench.sh dpdk nic-smoke --seconds 30
#
%YAML 1.2
---
daqiri:
  cfg:
    version: 1
    stream_type: "raw"
    master_core: 3
    debug: false
    log_level: "info"
    loopback: ""

    memory_regions:
    - name: "Data_TX_GPU"
      kind: "device"
      affinity: 0
      num_bufs: 51200
      buf_size: 8064
    - name: "Data_RX_GPU"
      kind: "device"
      affinity: 2
      num_bufs: 51200
      buf_size: 8064

    interfaces:
    - name: "tx_port"
      address: 0000:05:00.0
      tx:
        queues:
        - name: "tx_q_0"
          id: 0
          batch_size: 10240
          cpu_core: 11
          memory_regions:
            - "Data_TX_GPU"
          offloads:
            - "tx_eth_src"
    - name: "rx_port"
      address: 0000:75:00.0
      rx:
        flow_isolation: true
        queues:
        - name: "rq_q_0"
          id: 0
          cpu_core: 9
          batch_size: 10240
          memory_regions:
            - "Data_RX_GPU"
        flows:
        - name: "flow_0"
          id: 0
          action:
            type: queue
            id: 0
          match:
            udp_src: 4096
            udp_dst: 4096

bench_rx:
- interface_name: "rx_port"

bench_tx:
- interface_name: "tx_port"
  batch_size: 10240
  payload_size: 8000
  header_size: 64
  eth_dst_addr: <00:00:00:00:00:00>
  ip_src_addr: 1.2.3.4
  ip_dst_addr: 5.6.7.8
  udp_src_port: 4096
  udp_dst_port: 4096
