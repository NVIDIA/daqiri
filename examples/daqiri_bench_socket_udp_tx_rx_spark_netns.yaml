# DGX Spark (GB10) UDP socket bench -- combined base for the netns wire loopback.
#
# This is the single checked-in config for the UDP wire-loopback sweep. It carries
# BOTH roles (the udp_server / udp_client interfaces, their memory regions, and the
# socket_bench_server / socket_bench_client sections). A single process can't run
# it as-is across namespaces (it would init the peer namespace's IP), so
# scripts/gen_spark_netns_config.py splits it to one role at sweep time and
# run_spark_bench.sh runs each role in its own namespace, assigning ports/cores per
# pair. Server workers use [16, 18, 5, 7], client workers use [17, 19, 6, 9], and
# the server UDP I/O thread shares its server-worker core by default.
# SOCKET_RX_IO_CORES overrides the server I/O placement independently. To split by hand:
#   scripts/gen_spark_netns_config.py examples/daqiri_bench_socket_udp_tx_rx_spark_netns.yaml \
#       --role server > server.yaml
#   ip netns exec dq_wire_server daqiri_bench_socket server.yaml --seconds N --mode server
#
# Derived from examples/daqiri_bench_socket_udp_tx_rx.yaml (the 127.0.0.1 loopback
# smoke config): wire IPs 10.250.0.1/2 and iterations bumped to 1e9 so a timed
# --seconds run does not exhaust early. buf_size/max_payload_size are 65536/65535
# (>= the 65507 max UDP datagram the sweep sends): the bench memsets a full
# message_size into one TX buffer, so a smaller buf_size overflows the heap.
#
%YAML 1.2
---
daqiri:
  cfg:
    version: 1
    stream_type: "socket"
    master_core: 8
    debug: false
    log_level: "info"

    memory_regions:
    - name: "DATA_SOCKET_SERVER"
      kind: "host"
      affinity: 0
      num_bufs: 1024
      buf_size: 65536
    - name: "DATA_SOCKET_CLIENT"
      kind: "host"
      affinity: 0
      num_bufs: 1024
      buf_size: 65536

    interfaces:
    - name: udp_server
      address: 10.250.0.2
      socket_config:
        mode: server
        local_addr: "udp://10.250.0.2:5001"
        remote_addr: "udp://10.250.0.1:5002"
        max_payload_size: 65535
      rx:
        queues:
        - name: "Server_RX_Queue"
          id: 0
          cpu_core: 16
          # The socket engine passes up to one recvmmsg batch per DAQIRI burst.
          batch_size: 32
          memory_regions:
            - "DATA_SOCKET_SERVER"
      tx:
        queues:
        - name: "Server_TX_Queue"
          id: 0
          cpu_core: 16
          batch_size: 1
          memory_regions:
            - "DATA_SOCKET_SERVER"
    - name: udp_client
      address: 10.250.0.1
      socket_config:
        mode: client
        local_addr: "udp://10.250.0.1:5002"
        remote_addr: "udp://10.250.0.2:5001"
        max_payload_size: 65535
      tx:
        queues:
        - name: "Client_TX_Queue"
          id: 0
          cpu_core: 16
          batch_size: 1
          memory_regions:
            - "DATA_SOCKET_CLIENT"
      rx:
        queues:
        - name: "Client_RX_Queue"
          id: 0
          cpu_core: 16
          batch_size: 1
          memory_regions:
            - "DATA_SOCKET_CLIENT"

socket_bench_server:
  # Bench worker thread affinity (PR #149). run_spark_bench.sh rewrites this to
  # the pair's server-worker core, separately from the client worker and optional
  # UDP receive I/O core.
  cpu_core: 16
  server: true
  send: false
  receive: true
  iterations: 1000000000
  message_size: 1024
  server_address: 10.250.0.2
  server_port: 5001

socket_bench_client:
  cpu_core: 16
  server: false
  send: true
  receive: false
  iterations: 1000000000
  message_size: 1024
  server_address: 10.250.0.2
  client_address: 10.250.0.1
  server_port: 5001
